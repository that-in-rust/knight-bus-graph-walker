[package]
name = "knight-bus"
version = "0.0.2"
edition = "2024"

[lib]
name = "knight_bus"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
boltr = "0.2.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
grafeo-adapters = { version = "0.5.42", default-features = false, features = ["cypher"] }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
sysinfo = "0.30"
tempfile = "3.15"
thiserror = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.5"
